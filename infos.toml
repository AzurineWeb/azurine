# --- Questions fréquentes (page d'accueil) -----------------------------------
# Un bloc [[faq]] par question, dans l'ordre d'affichage.
# Dans les réponses, ces mots entre accolades sont remplacés automatiquement par
# l'information à jour (les écrire exactement ainsi) :
#   {telephone}  {horaires}  {reglement}  {duree_seance_en_lettres}
#   {soin_energetique_adulte}  {soin_energetique_enfant}
#   {massage_sonore_adulte}  {massage_sonore_enfant}  {massage_sonore_age_minimum}
# Les prix s'affichent avec « € » : écrire {soin_energetique_adulte} et non {soin_energetique_adulte} €.

[[faq]]
question = "Combien dure une séance et quel est son prix ?"
reponse = "Une séance à la salle de soin dure {duree_seance_en_lettres}. Soin énergétique : {soin_energetique_adulte} pour un adulte, {soin_energetique_enfant} pour un enfant de moins de 16 ans. Massage sonore aux bols tibétains : {massage_sonore_adulte} pour un adulte, {massage_sonore_enfant} pour un enfant de moins de 16 ans. Pour le soin à distance, le tarif et la durée vous sont communiqués par téléphone, au {telephone}."

[[faq]]
question = "Les soins conviennent-ils aux enfants ?"
reponse = "Oui. Le soin énergétique s'adresse aux enfants sans âge minimum, le massage sonore à partir de {massage_sonore_age_minimum} ans. Pour tout mineur, la présence d'un parent est obligatoire pendant la séance."

[[faq]]
question = "Peut-on recevoir un soin sans se déplacer ?"
reponse = "Oui, le soin énergétique peut se faire à distance. Appelez-moi au {telephone} : je vous présente les modalités, la durée et le tarif."

[[faq]]
question = "Quels sont les horaires ?"
reponse = "Je vous reçois uniquement sur rendez-vous, habituellement {horaires}. Les créneaux disponibles sont affichés sur l'agenda en ligne."

[[faq]]
question = "Comment régler une séance ?"
reponse = "{reglement}."

[[faq]]
question = "Peut-on annuler ou reporter un rendez-vous ?"
reponse = "Oui, sans frais et sans délai minimum, même en cas d'empêchement de dernière minute ou de rendez-vous manqué."

[[faq]]
question = "Où se trouve la salle de soin ?"
reponse = "La salle de soin se trouve au 18 rue de la Salle, à Carquefou, aux portes de Nantes, à quelques minutes de Sainte-Luce-sur-Loire, Thouaré-sur-Loire et La Chapelle-sur-Erdre."

[[faq]]
question = "Proposez-vous des bons cadeaux ?"
reponse = "Oui, pour les différentes prestations. Ils sont disponibles sur place, à la salle de soin, sans rendez-vous."


