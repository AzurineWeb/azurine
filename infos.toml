# =============================================================================
#  INFORMATIONS DU SITE AZURINE
# =============================================================================
#
#  Ce fichier contient les informations que vous pouvez modifier vous-même :
#  tarifs, horaires, coordonnées, questions fréquentes et avis.
#  Chaque information est écrite une seule fois ici et reprise partout sur le site.
#
#  Comment modifier :
#    1. Sur GitHub, ouvrir ce fichier puis cliquer sur le crayon (« Edit this file »).
#    2. Changer uniquement ce qui se trouve entre guillemets "…" ou un nombre.
#    3. Cliquer sur « Commit changes… » puis de nouveau sur « Commit changes ».
#    4. Le site est mis à jour environ une minute plus tard.
#
#  Règles à respecter :
#    - Les lignes qui commencent par # sont des explications : elles ne sont pas affichées.
#    - Garder les guillemets droits "…" autour des textes. Dans un texte, écrire ' (apostrophe)
#      sans problème ; pour mettre des guillemets, utiliser « … ».
#    - Les prix sont des nombres entiers, sans « € » : 60 et non "60 €".
#    - Les heures s'écrivent "11:00", "17:30".
#
#  En cas d'erreur, le site n'est pas cassé : la mise à jour est simplement refusée et
#  la version précédente reste en ligne. Netlify prévient par e-mail ; le message qui
#  indique la ligne à corriger se lit dans Netlify, rubrique « Deploys », en cliquant
#  sur la mise en ligne marquée « Failed ».
# =============================================================================


