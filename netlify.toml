# Configuration Netlify (prioritaire sur les réglages de l'interface).
# Le site est fait de fichiers HTML/CSS publiés tels quels : aucune étape de génération.
# Seul le dossier site/ est mis en ligne (les fichiers de documentation restent privés).
[build]
  publish = "site"
  command = ""
  # Chaque mise en ligne coûte 15 crédits Netlify (300 par mois sur l'offre gratuite).
  # Une modification qui ne touche pas site/ (README, documentation) n'est pas publiée.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/"
