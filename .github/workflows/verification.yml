# Vérifie que le site se génère sans erreur à chaque modification (notamment de infos.toml).
# En cas d'erreur : croix rouge à côté du commit sur GitHub, et e-mail de GitHub à l'auteur
# de la modification, avec un lien vers le message (en français) qui indique quoi corriger.
# Netlify génère le site de son côté avec la même commande ; si elle échoue, la version
# précédente reste en ligne.
name: Vérification du site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    name: Vérifier infos.toml et générer le site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # même version que netlify.toml
      - name: Générer le site
        run: python3 -I build.py
